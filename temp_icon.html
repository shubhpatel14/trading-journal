<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 512px;
    height: 512px;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 512px;
    height: 512px;

</style>

<body>

        <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />

    <circle cx="50" cy="50" r="48" fill="url(#tf-brand-gradient)" />

</body>
</html>
